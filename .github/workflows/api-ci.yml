name: API

on:
  pull_request:
    paths:
      - 'api/**'
      # Read by the API at startup and by its tests.
      - 'schedule.yaml'
      - 'testdata/**'
      - '.github/workflows/api-ci.yml'

# Both jobs are read-only, so cancelling a superseded run costs nothing.
concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # The store's tests run against a real Postgres; without TEST_DATABASE_URL they
    # skip. Same major version as Neon and devbox.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7

      # The Go version comes from go.mod rather than being pinned twice, so it
      # cannot drift from what devbox installs.
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Test
        run: go test -race ./...
        working-directory: api
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # The repository root is the context, so the image can carry schedule.yaml.
      - name: Build
        run: docker build -f api/Dockerfile -t aocn-api:${{ github.sha }} .
