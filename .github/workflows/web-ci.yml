name: Web

on:
  pull_request:
    paths:
      - 'web/**'
      # The website builds its dates from it.
      - 'schedule.yaml'
      - 'testdata/**'
      - '.github/workflows/web-ci.yml'

# Read-only, so cancelling a superseded run costs nothing.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y:
    name: Accessibility
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      # Matches nodejs@24 in devbox.json.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # The same build Netlify runs: astro check, vitest, astro build.
      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm run test:a11y

      # A screenshot and page snapshot of each failure, for when the log is not enough.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: a11y-results
          path: web/test-results/
          retention-days: 7
