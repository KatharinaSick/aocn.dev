name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'

# Two rollouts would fight over which revision is newest. Never cancel one in
# flight: a half-finished rollout is worse than a queued one.
concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  REGION: europe-west1
  SERVICE: aocn-api
  REPOSITORY: aocn

jobs:
  # The pull request that led here already ran these. Running them again is what
  # makes a broken main fail the deploy instead of reaching production.
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Test
        run: go test ./...
        working-directory: api

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to request the OIDC token for Workload Identity Federation

    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_DEPLOYER }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # Tagged with the commit, so a revision can always be traced back to the
      # source it was built from.
      - name: Build and push
        id: image
        env:
          PROJECT: ${{ steps.auth.outputs.project_id }}
        run: |
          # The project comes from the identity we authenticated as. Fail loudly if
          # that ever stops resolving, rather than pushing to a malformed path.
          : "${PROJECT:?auth did not report a project_id}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/${REPOSITORY}/api:${GITHUB_SHA}"
          docker build -t "$IMAGE" api
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # update, not deploy: `gcloud run deploy` would create the service if it were
      # missing, taking ownership away from OpenTofu. This fails instead.
      - name: Roll out
        run: |
          gcloud run services update "$SERVICE" \
            --region "$REGION" \
            --image "${{ steps.image.outputs.image }}"
